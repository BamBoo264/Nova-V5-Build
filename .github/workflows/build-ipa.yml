name: Build Mugoat Nova Runtime V5 Online
on:
  push:
    branches:
      - nova-2
      - nova-online
      - nova-native-runtime-v1
  workflow_dispatch:
    inputs:
      runner:
        description: Runner environment
        type: choice
        options:
          - macos-15
          - macos-26
          - macos-latest
        default: macos-15
      build_ipa:
        description: Build Release IPA after all checks
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: mugoat-nova-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          python3 tools/test_native_codegen.py
          python3 tools/test_nova_integrity.py
          python3 tools/test_nova_online.py
          python3 tools/test_port_rpf_loader.py
      - name: Type-check all production Swift against the iPhone SDK
        run: |
          xcrun swiftc -typecheck -parse-as-library -target arm64-apple-ios15.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -import-objc-header app/Source/Native-Bridging-Header.h -I app/Source -I app/App/GameInstaller app/App/*.swift app/App/GameInstaller/*.swift
      - name: Check native graphics bridge C ABI before engine compilation
        run: |
          xcrun clang++ -std=c++20 -fobjc-arc -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -I app/Source -c app/Source/MetalGraphicsHost.mm -o "$RUNNER_TEMP/nova-graphics.o"
          nm -g "$RUNNER_TEMP/nova-graphics.o" | grep ' T _PGSetNovaOutput$'
      - name: Type-check production archive persistence and renderer diagnostics
        run: xcrun clang++ -std=c++20 -fobjc-arc -fsyntax-only -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -I app/Source -I app/Source/MetalRenderer app/Source/MetalRenderer/MRRenderer.mm
      - name: Real UDP room handshake and relay tests on macOS
        run: |
          clang -c app/Tests/online_stubs.c -I app/Source -I app/Tests -o "$RUNNER_TEMP/online-stubs.o"
          swiftc -import-objc-header app/Tests/online_bridge.h -I app/Source app/App/OnlineRoomManager.swift app/App/NovaRoomProtocol.swift app/App/NovaInternetTransport.swift app/Tests/nova_lan.swift "$RUNNER_TEMP/online-stubs.o" -framework Network -framework QuartzCore -o "$RUNNER_TEMP/nova-lan"
          "$RUNNER_TEMP/nova-lan"
      - name: Production Internet client against live Free relay
        run: |
          swiftc -import-objc-header app/Tests/online_bridge.h -I app/Source app/App/OnlineRoomManager.swift app/App/NovaRoomProtocol.swift app/App/NovaInternetTransport.swift app/Tests/nova_internet.swift "$RUNNER_TEMP/online-stubs.o" -framework Network -framework QuartzCore -o "$RUNNER_TEMP/nova-internet"
          "$RUNNER_TEMP/nova-internet"
      - name: Replica vehicle pose interpolation
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I app/Source app/Tests/nova_vehicle_blend.c -o "$RUNNER_TEMP/nova-vehicle-blend"
          "$RUNNER_TEMP/nova-vehicle-blend"
      - name: Online seat, shots, glass, voice and PvP regression on live relay
        run: node relay/test-relay.mjs wss://mugoat-nova-relay.hutaolee264.workers.dev
      - name: Production PAD layout and spatial scaling tests
        run: |
          python3 tools/test_manual_layout.py "$RUNNER_TEMP"
          python3 tools/test_nova_scale.py "$RUNNER_TEMP"
      - name: Production language pack reader with memory sanitizers
        if: hashFiles('app/Resources/VietnameseAccented.nvp') != ''
        run: |
          clang -fobjc-arc -fsanitize=address,undefined -framework Foundation app/Source/NovaLanguagePack.m app/Tests/nova_pack.m -o "$RUNNER_TEMP/nova-pack"
          "$RUNNER_TEMP/nova-pack" "$PWD/app/Resources"
      - name: Production vehicle, skin and audio importer tests
        run: |
          python3 tools/prepare_ci_archive.py "$RUNNER_TEMP/host-archive"
          export PG_HOST_ARCHIVE="$PWD/app/Vendor/libarchive.xcframework/macos-arm64"
          python3 tools/extract_compatibility_test.py "$RUNNER_TEMP/compat.c"
          cd app
          clang -c App/GameInstaller/GameInstallerShim.c -I "$PG_HOST_ARCHIVE/Headers" -o "$RUNNER_TEMP/archive.o"
          clang -c Source/SoundInflate.c -o "$RUNNER_TEMP/inflate.o"
          clang -c Tests/SoundTestStubs.c -o "$RUNNER_TEMP/stubs.o"
          clang -c "$RUNNER_TEMP/compat.c" -o "$RUNNER_TEMP/compat.o"
          swiftc -import-objc-header Tests/SoundTestBridge.h -I App/GameInstaller App/ModInstaller.swift App/SoundArchive.swift App/SoundInstaller.swift App/SkinInstaller.swift App/ModVehicleSupport.swift App/BundledMenyoo.swift Tests/SoundTestStubs.swift Tests/nova_mod_import.swift "$RUNNER_TEMP/archive.o" "$RUNNER_TEMP/inflate.o" "$RUNNER_TEMP/stubs.o" "$RUNNER_TEMP/compat.o" "$PG_HOST_ARCHIVE/libarchive.a" -lz -lbz2 -o "$RUNNER_TEMP/nova-mod-import"
          "$RUNNER_TEMP/nova-mod-import"
      - name: Log flood and camera filesystem regressions
        run: |
          clang -std=c11 -I app/Source -fsanitize=address,undefined app/Tests/nova_log_filter.c -o "$RUNNER_TEMP/nova-log-filter"
          "$RUNNER_TEMP/nova-log-filter"
          python3 tools/test_camera_filesystem.py "$RUNNER_TEMP"
          clang -std=c11 -I app/Source -fsanitize=address,undefined app/Tests/nova_movement.c -o "$RUNNER_TEMP/nova-movement"
          "$RUNNER_TEMP/nova-movement"
      - name: Assemble checked original engine inputs
        if: github.event_name == 'push' || inputs.build_ipa
        run: python3 app/Scripts/assemble_inputs.py --inputs . --out "$RUNNER_TEMP/game-files"
      - name: Install Xcode project generator and Metal compiler
        if: github.event_name == 'push' || inputs.build_ipa
        run: |
          command -v xcodegen || brew install xcodegen
          xcrun -sdk iphoneos metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          echo "PGMSL_PREBUILT_URL=file://$PWD/build-tools/pgmsl-macos-arm64.tar.gz" >> "$GITHUB_ENV"
      - name: Prepare and validate generated native engine before Release build
        if: github.event_name == 'push' || inputs.build_ipa
        run: |
          cd app
          python3 Scripts/check_game_files.py --mirror "$RUNNER_TEMP/game-files"
          python3 Scripts/prepare.py --mirror "$RUNNER_TEMP/game-files"
          python3 Scripts/verify_nova_native_base.py
          INCLUDES="-I Source -I Generated -I Tools/wabt-1.0.42/include -I Tools/wabt-1.0.42/share/wabt/wasm2c -I Tools/simde"
          clang -std=c11 -O2 -fsanitize=address,undefined -DNOVA_CACHED_MEMORY_BASE=1 $INCLUDES Tests/nova_cached_memory.c -o "$RUNNER_TEMP/cached-memory-tests"
          "$RUNNER_TEMP/cached-memory-tests"
          clang -std=c11 -O2 -fsanitize=address,undefined -DNOVA_CACHED_MEMORY_BASE=0 $INCLUDES Tests/nova_cached_memory.c -o "$RUNNER_TEMP/baseline-memory-tests"
          "$RUNNER_TEMP/baseline-memory-tests"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for UNIT in Generated/game_*.c; do
            xcrun clang -fsyntax-only -w -std=c11 -target arm64-apple-ios15.0 -isysroot "$SDK" $INCLUDES -include Source/NativeRuntime.h -DNOVA_CACHED_MEMORY_BASE=1 -DPG_UNCHECKED_MEMORY=1 -DWASM_RT_USE_MMAP=0 -DWASM_RT_MEMCHECK_BOUNDS_CHECK=1 -DWASM_RT_SKIP_SIGNAL_RECOVERY=1 "$UNIT"
          done
      - name: Release Nova gameplay IPA after all preflight checks
        if: github.event_name == 'push' || inputs.build_ipa
        env:
          JOBS: "3"
          NOVA_PREPARED: "1"
        run: bash build_ipa.sh --mirror "$RUNNER_TEMP/game-files"
      - name: Package and verify memory-entitled Release IPA without rebuilding engine
        if: github.event_name == 'push' || inputs.build_ipa
        run: python3 tools/package_variants.py
      - uses: actions/upload-artifact@v4
        if: success() && (github.event_name == 'push' || inputs.build_ipa)
        with:
          name: Mugoat-Nova-NativeRuntime-V8.1-UDP
          path: Mugoat-Nova-NativeRuntime-V8.1-UDP.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Nova-build-diagnostics
          path: |
            app/Build/xcodebuild.log
            app/Generated/nova-native-codegen.json
          retention-days: 7
