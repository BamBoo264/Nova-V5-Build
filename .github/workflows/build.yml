name: Build Nova V8.2 UDP IPA
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA of the Nova V8.2 source
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nova-v8-ipa
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BamBoo264/Mugoat-Ios
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.NOVA_SOURCE_SSH_KEY }}
          persist-credentials: false
      - name: Validate source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(uname -m)" = arm64
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/test_nova_integrity.py
          python3 tools/test_nova_online.py
      - name: Prepare engine and Rust bridge
        run: |
          command -v xcodegen || brew install xcodegen
          xcrun -sdk iphoneos metal --version || xcodebuild -downloadComponent MetalToolchain
          export PGMSL_PREBUILT_URL="file://$PWD/build-tools/pgmsl-macos-arm64.tar.gz"
          python3 app/Scripts/assemble_inputs.py --inputs . --out "$RUNNER_TEMP/game-files"
          cd app
          python3 Scripts/prepare.py --mirror "$RUNNER_TEMP/game-files"
          python3 Scripts/verify_nova_native_base.py
      - name: Compile Nova ARM64 Release
        env:
          JOBS: '3'
          NOVA_PREPARED: '1'
        run: |
          if ! bash build_ipa.sh --mirror "$RUNNER_TEMP/game-files" > "$RUNNER_TEMP/nova-build.log" 2>&1; then
            grep -E 'error:|undefined symbol|fatal:|failed|ld:' "$RUNNER_TEMP/nova-build.log" app/Build/xcodebuild.log | cut -c1-500 | tail -40 || true
            exit 1
          fi
      - name: Package and verify direct IPA
        run: python3 tools/package_variants.py
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-V8.2-UDP
          path: Mugoat-Nova-NativeRuntime-V8.2-UDP.ipa
          if-no-files-found: error
          retention-days: 14
